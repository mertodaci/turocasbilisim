name: Android APK

# Elle "Run workflow" ile ya da v* tag'i push edilince calisir.
# Ureten: android/app/build/outputs/apk/... -> "taskqube-apk" artifact'i.
#
# Keystore secret'lari (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) tanimliysa RELEASE (imzali) APK,
# tanimli degilse DEBUG APK uretir (sideload icin yeterli).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons (assets/icon.png varsa)
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android
          else
            echo "assets/icon.png yok -> varsayilan Capacitor ikonu kullanilacak."
          fi

      - name: Build web (dist)
        run: npm run build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Prepare signing (secret varsa)
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            {
              echo "storeFile=upload.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release imzasi hazir."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Keystore secret yok -> DEBUG APK uretilecek."
          fi

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskqube-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
